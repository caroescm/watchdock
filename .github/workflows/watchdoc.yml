name: Watchdoc
on:
  pull_request:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          nvidia_api_key: ${{ secrets.NVIDIA_API_KEY }}