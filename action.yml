name: 'Watchdoc'
description: 'Catches semantic drift in docs and AI-agent instruction files on every PR'
inputs:
  nvidia_api_key:
    description: 'NVIDIA NIM API key'
    required: true
  github_token:
    description: 'GitHub token for reading PRs and posting results'
    required: false
    default: ${{ github.token }}
branding:
  icon: 'eye'
  color: 'orange'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install ${{ github.action_path }} ${{ github.action_path }}/watchdoc_detector
    - name: Run Watchdoc
      shell: bash
      env:
        NVIDIA_API_KEY: ${{ inputs.nvidia_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        nat run \
          --config_file ${{ github.action_path }}/watchdoc_detector/src/watchdoc_detector/configs/config.yml \
          --input "check this PR"
