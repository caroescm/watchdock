[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64"]

[project]
name = "watchdock"
version = "0.1.0"
description = "Catches semantic drift in docs and AI-agent instruction files on every PR"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyGithub>=2.0",
  "openai>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# benchmark/ is a set of scripts, not a package; expose it to the tests that
# exercise the deterministic baseline without a sys.path hack in conftest.
pythonpath = ["benchmark"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "watchdock_detector/src", "benchmark", "tests"]

[tool.ruff.lint]
# BLE: every broad `except Exception` must carry a `# noqa: BLE001` with the
# reason it is deliberate. B: common bug patterns, including zip() without strict.
select = ["E", "F", "W", "B", "BLE", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt text and benchmark fixtures are data; wrapping them would change what the model sees.
"src/watchdock/prompts.py" = ["E501"]
"benchmark/cases.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["watchdock", "watchdock_detector"]
