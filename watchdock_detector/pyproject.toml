[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64"]

[project]
name = "watchdock_detector"
version = "0.1.0"
description = "NeMo Agent Toolkit entry point for the Watchdock drift detector"
requires-python = ">=3.11,<3.14"
classifiers = ["Programming Language :: Python"]
dependencies = [
  "nvidia-nat~=1.8",
  "watchdock==0.1.0",
]

[project.entry-points.'nat.components']
watchdock_detector = "watchdock_detector.register"
